="818.11" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="400" fill="#555555">Главная → «Продолжить урок»</text><path d="M1110 425 L1370 425" stroke="#AAAAAA" stroke-width="3" fill="none"/><path d="M1370 425 L1370 760" stroke="#AAAAAA" stroke-width="3" fill="none"/><polygon points="1370,760 1363.9,747.4 1376.1,747.4" fill="#AAAAAA"/><path d="M1170 835 L1110 835" stroke="#AAAAAA" stroke-width="3" fill="none"/><polygon points="1110,835 1122.6,828.9 1122.6,841.1" fill="#AAAAAA"/><text x="48" y="2106.6" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="400" fill="#555555">Назад: из теста — «К материалу»; из урока — «Курсы» (тот же поиск и фильтры);</text><text x="48" y="2140.6" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="400" fill="#555555">из результата — «Открыть каталог». ИИ-помощник открывается кнопкой в шапке на любом шаге.</text></svg>