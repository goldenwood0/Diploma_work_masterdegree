<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2240" viewBox="0 0 1600 2240"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="48" y="61.879999999999995" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="36" font-weight="700" fill="#222222">User Flow · пройти урок и сдать тест (версия 2)</text><rect x="460" y="100" width="650" height="70" rx="35" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="2"/><text x="478" y="140.06" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#222222">00 Вход · почта и пароль</text><path d="M785 170 L785 210" stroke="#AAAAAA" stroke-width="3" fill="none"/><polygon points="785,210 778.9,197.4 791.1,197.4" fill="#AAAAAA"/><polygon points="785,210 1010,275 785,340 560,275" fill="#EEEEEE" stroke="#555555" stroke-width="2"/><text x="610" y="279.26" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#222222">D1 Вход выполнен?</text><rect x="30" y="230" width="350" height="90" rx="10" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="2"/><text x="48" y="260.26" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#222222">Ошибка входа</text><text x="48" y="288.11" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="400" fill="#555555">Исправить данные</text><path d="M560 275 L380 275" stroke="#AAAAAA" stroke-width="3" fill="none"/><polygon points="380,275 392.6,268.9 392.6,281.1" fill="#AAAAAA"/><text x="400" y="256.94" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#555555">Нет</text><path d="M205 230 L205 135" stroke="#AAAAAA" stroke-width="3" fill="none"/><path d="M205 135 L460 135" stroke="#AAAAAA" stroke-width="3" fill="none"/><polygon points="460,135 447.4,141.1 447.4,128.9" fill="#AAAAAA"/><path d="M785 340 L785 390" stroke="#AAAAAA" stroke-width="3" fill="none"/><polygon points="785,390 778.9,377.4 791.1,377.4" fill="#AAAAAA"/><text x="799" y="364.94" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#555555">Да</text><rect x="460" y="390" width="650" height="70" rx="10" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="2"/><text x="478" y="420.26" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#222222">01 Главная</text><text x="478" y="448.11" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="400" fill="#555555">«Продолжить урок» или «Курсы»</text><path d="M785 460 L785 510" stroke="#AAAAAA" stroke-width="3" fill="none"/><polygon points="785,510 778.9,497.4 791.1,497.4" fill="#AAAAAA"/><rect x="460" y="510" width="650" height="70" rx="10" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="2"/><text x="478" y="540.26" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#222222">02 Каталог · запрос и фильтры</text><text x="478" y="568.11" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="400" fill="#555555">Поиск из шапки ведёт сюда же</text><path d="M785 580 L785 620" stroke="#AAAAAA" stroke-width="3" fill="none"/><polygon points="785,620 778.9,607.4 791.1,607.4" fill="#AAAAAA"/><polygon points="785,620 1010,685 785,750 560,685" fill="#EEEEEE" stroke="#555555" stroke-width="2"/><text x="610" y="689.26" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#222222">D2 Урок найден?</text><rect x="30" y="640" width="350" height="90" rx="10" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="2"/><text x="48" y="670.26" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#222222">07 Ничего не найдено</text><text x="48" y="698.11" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="400" fill="#555555">«Сбросить фильтры»</text><path d="M560 685 L380 685" stroke="#AAAAAA" stroke-width="3" fill="none"/><polygon points="380,685 392.6,678.9 392.6,691.1" fill="#AAAAAA"/><text x="400" y="666.94" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#555555">Нет</text><path d="M205 640 L205 545" stroke="#AAAAAA" stroke-width="3" fill="none"/><path d="M205 545 L460 545" stroke="#AAAAAA" stroke-width="3" fill="none"/><polygon points="460,545 447.4,551.1 447.4,538.9" fill="#AAAAAA"/><path d="M785 750 L785 800" stroke="#AAAAAA" stroke-width="3" fill="none"/><polygon points="785,800 778.9,787.4 791.1,787.4" fill="#AAAAAA"/><text x="799" y="774.94" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#555555">Да</text><rect x="460" y="800" width="650" height="70" rx="10" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="2"/><text x="478" y="830.26" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#222222">04 Урок · разминка → материал</text><text x="478" y="858.11" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="400" fill="#555555">Блоки по порядку, затем «К тесту»</text><path d="M785 870 L785 920" stroke="#AAAAAA" stroke-width="3" fill="none"/><polygon points="785,920 778.9,907.4 791.1,907.4" fill="#AAAAAA"/><rect x="460" y="920" width="650" height="70" rx="10" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="2"/><text x="478" y="950.26" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#222222">05 Тест · выбрать ответ → «Проверить»</text><text x="478" y="978.11" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="400" fill="#555555">Один вопрос на экран</text><path d="M785 990 L785 1030" stroke="#AAAAAA" stroke-width="3" fill="none"/><polygon points="785,1030 778.9,1017.4 791.1,1017.4" fill="#AAAAAA"/><polygon points="785,1030 1010,1095 785,1160 560,1095" fill="#EEEEEE" stroke="#555555" stroke-width="2"/><text x="610" y="1099.26" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#222222">D3 Ответ верный?</text><rect x="30" y="1050" width="350" height="110" rx="10" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="2"/><text x="48" y="1080.26" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#222222">Неверно</text><text x="48" y="1108.11" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="400" fill="#555555">Правильный ответ и объяснение;</text><text x="48" y="1134.11" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="400" fill="#555555">по желанию «Объясни ошибку» (ИИ)</text><path d="M560 1095 L380 1095" stroke="#AAAAAA" stroke-width="3" fill="none"/><polygon points="380,1095 392.6,1088.9 392.6,1101.1" fill="#AAAAAA"/><text x="400" y="1076.94" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#555555">Нет</text><path d="M205 1160 L205 1245" stroke="#AAAAAA" stroke-width="3" fill="none"/><path d="M205 1245 L460 1245" stroke="#AAAAAA" stroke-width="3" fill="none"/><polygon points="460,1245 447.4,1251.1 447.4,1238.9" fill="#AAAAAA"/><path d="M785 1160 L785 1210" stroke="#AAAAAA" stroke-width="3" fill="none"/><polygon points="785,1210 778.9,1197.4 791.1,1197.4" fill="#AAAAAA"/><text x="799" y="1184.94" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#555555">Да</text><rect x="460" y="1210" width="650" height="70" rx="10" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="2"/><text x="478" y="1240.26" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#222222">«Дальше»</text><text x="478" y="1268.11" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="400" fill="#555555">После «Верно!» или «Неверно»; ответ зафиксирован</text><path d="M785 1280 L785 1320" stroke="#AAAAAA" stroke-width="3" fill="none"/><polygon points="785,1320 778.9,1307.4 791.1,1307.4" fill="#AAAAAA"/><polygon points="785,1320 1010,1385 785,1450 560,1385" fill="#EEEEEE" stroke="#555555" stroke-width="2"/><text x="610" y="1389.26" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#222222">D4 Это последний вопрос?</text><path d="M1010 1385 L1250 1385" stroke="#AAAAAA" stroke-width="3" fill="none"/><path d="M1250 1385 L1250 955" stroke="#AAAAAA" stroke-width="3" fill="none"/><path d="M1250 955 L1110 955" stroke="#AAAAAA" stroke-width="3" fill="none"/><polygon points="1110,955 1122.6,948.9 1122.6,961.1" fill="#AAAAAA"/><text x="1030" y="1366.94" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#555555">Нет</text><path d="M785 1450 L785 1500" stroke="#AAAAAA" stroke-width="3" fill="none"/><polygon points="785,1500 778.9,1487.4 791.1,1487.4" fill="#AAAAAA"/><text x="799" y="1474.94" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#555555">Да</text><rect x="460" y="1500" width="650" height="70" rx="10" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="2"/><text x="478" y="1530.26" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#222222">05 «Завершить тест»</text><text x="478" y="1558.11" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="400" fill="#555555">Отправка всех ответов</text><path d="M785 1