ill="#EEEEEE" stroke="none" stroke-width="2"/><text x="1310" y="40.11" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#222222">ДУ</text><text x="96" y="114.11" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="400" fill="#555555">КУРСЫ / МЕНЯ ЗОВУТ… / ТЕСТ УРОКА</text><text x="96" y="160.22" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#222222">Тест урока</text><text x="96" y="202.6" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#555555">Вопрос 1 / 6</text><text x="1180" y="202.6" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#222222">Верно: 0/1</text><rect x="96" y="222" width="198" height="8" rx="4" fill="#333333" stroke="none" stroke-width="2"/><rect x="306" y="222" width="198" height="8" rx="4" fill="#EEEEEE" stroke="none" stroke-width="2"/><rect x="516" y="222" width="198" height="8" rx="4" fill="#EEEEEE" stroke="none" stroke-width="2"/><rect x="726" y="222" width="198" height="8" rx="4" fill="#EEEEEE" stroke="none" stroke-width="2"/><rect x="936" y="222" width="198" height="8" rx="4" fill="#EEEEEE" stroke="none" stroke-width="2"/><rect x="1146" y="222" width="198" height="8" rx="4" fill="#EEEEEE" stroke="none" stroke-width="2"/><text x="96" y="286.9" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700" fill="#222222">Как сказать «Меня зовут Анна»?</text><rect x="96" y="322" width="1248" height="62" rx="10" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="2"/><text x="120" y="358.26" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="400" fill="#222222">○ 我叫安娜。</text><rect x="96" y="398" width="1248" height="62" rx="10" fill="#EEEEEE" stroke="#333333" stroke-width="2"/><text x="120" y="434.26" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#222222">● 你叫安娜。</text><rect x="96" y="474" width="1248" height="62" rx="10" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="2"/><text x="120" y="510.26" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="400" fill="#222222">○ 安娜叫我。</text><rect x="96" y="568" width="1248" height="210" rx="12" fill="#EEEEEE" stroke="#333333" stroke-width="2"/><text x="124" y="611.58" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="26" font-weight="700" fill="#222222">✕ Неверно</text><text x="124" y="653.43" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" fill="#222222">Правильный ответ: 我叫安娜。</text><text x="124" y="688.6" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="400" fill="#555555">О себе говорят через 我: 我 + 叫 + имя.</text><rect x="124" y="700" width="260" height="56" rx="10" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="2"/><text x="144" y="733.43" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" fill="#222222">✦ Объясни ошибку</text><rect x="96" y="810" width="260" height="56" rx="10" fill="#333333" stroke="none" stroke-width="2"/><text x="116" y="843.43" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Дальше</text><rect x="380" y="810" width="240" height="56" rx="10" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="2"/><text x="400" y="843.43" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" fill="#222222">← К материалу</text><text x="96" y="914.94" font-family="Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#555555">Ответ заблокирован после «Проверить»; до проверки кнопка называется «Проверить», на последнем вопросе — «Завершить тест».</text></svg>